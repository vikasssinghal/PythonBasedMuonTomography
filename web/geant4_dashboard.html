<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Geant4 Reconstruction Dashboard</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050510; color: white; font-family: sans-serif; }
        #info { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 8px; border: 1px solid #00ffcc; }
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 24px; color: #00ffcc; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="info">
        <h2>Geant4 Data Visualization</h2>
        <p><span style="color: #00ff00;">Green:</span> Muon Tracks</p>
        <p><span style="color: #ff0000;">Red Dots:</span> Hit Pixels on Planes</p>
        <p><span style="color: #ff00ff;">Magenta:</span> PoCA Points</p>
        <p><span style="color: #ffaa00;">Orange:</span> Reconstructed Voxels</p>
        <p><span style="color: #888888;">Grey:</span> Detector Planes & Container</p>
    </div>
    <div id="loading">Loading Geant4 Data...</div>

    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(120, 80, 180);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const planeGeo = new THREE.BoxGeometry(100, 100, 1);
        const planeMat = new THREE.MeshBasicMaterial({ color: 0x888888, transparent: true, opacity: 0.1 });
        const planeZ = [55, 45, 35, 25, -25, -35, -45, -55];
        planeZ.forEach(z => {
            const plane = new THREE.Mesh(planeGeo, planeMat);
            plane.position.set(0, 0, z);
            scene.add(plane);
            const edges = new THREE.EdgesGeometry(planeGeo);
            const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x555555 }));
            line.position.set(0, 0, z);
            scene.add(line);
        });

        const containerGeo = new THREE.BoxGeometry(40, 40, 40);
        const containerEdges = new THREE.EdgesGeometry(containerGeo);
        const containerLine = new THREE.LineSegments(containerEdges, new THREE.LineBasicMaterial({ color: 0xaaaaaa, linewidth: 2 }));
        scene.add(containerLine);

        fetch('data.json')
            .then(response => response.json())
            .then(data => {
                document.getElementById('loading').style.display = 'none';
                
                const hitsGeo = new THREE.BufferGeometry();
                const hitsVertices = [];
                data.hits.forEach(h => hitsVertices.push(h.x, h.y, h.z));
                hitsGeo.setAttribute('position', new THREE.Float32BufferAttribute(hitsVertices, 3));
                const hitsMat = new THREE.PointsMaterial({ color: 0xff0000, size: 2.5 });
                scene.add(new THREE.Points(hitsGeo, hitsMat));

                data.tracks.forEach(track => {
                    const points = track.map(p => new THREE.Vector3(p.x, p.y, p.z));
                    const geometry = new THREE.BufferGeometry().setFromPoints(points);
                    const material = new THREE.LineBasicMaterial({ color: 0x00ff00, transparent: true, opacity: 0.3 });
                    scene.add(new THREE.Line(geometry, material));
                });

                const pocaGeo = new THREE.BufferGeometry();
                const pocaVertices = [];
                data.poca_points.forEach(p => pocaVertices.push(p.x, p.y, p.z));
                pocaGeo.setAttribute('position', new THREE.Float32BufferAttribute(pocaVertices, 3));
                const pocaMat = new THREE.PointsMaterial({ color: 0xff00ff, size: 1.5 });
                scene.add(new THREE.Points(pocaGeo, pocaMat));

                data.voxels.forEach(v => {
                    const geo = new THREE.BoxGeometry(1, 1, 1);
                    const mat = new THREE.MeshBasicMaterial({ color: 0xffaa00, transparent: true, opacity: v.density });
                    const cube = new THREE.Mesh(geo, mat);
                    cube.position.set(v.x, v.y, v.z);
                    scene.add(cube);
                });
            })
            .catch(err => {
                console.error(err);
                document.getElementById('loading').innerText = "Error loading data.json.";
            });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
